name: publish review image

on:
  push:
    tags:
      - 'review-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本
        id: meta
        run: |
          if [ "${GITHUB_REF#refs/tags/review-v}" != "$GITHUB_REF" ]; then
            echo "version=${GITHUB_REF#refs/tags/review-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: server/review-service
          file: server/review-service/Dockerfile
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          load: true
          # 不再推 sha-*（每次构建都涨）；版本 pin 用 review-v* 标签
          tags: |
            ghcr.io/${{ github.repository_owner }}/dsh-review:latest
            ghcr.io/${{ github.repository_owner }}/dsh-review:${{ steps.meta.outputs.version }}

      # 门禁：容器内自测不过就不推
      - name: 容器内自测
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/server/review-service:/work" -w /work \
            ghcr.io/${{ github.repository_owner }}/dsh-review:latest \
            -c "python -m app.selftest && python tests/test_repo_gitdiff.py && python tests/test_context_parallel.py"

      - name: 推送
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/dsh-review:latest
          docker push ghcr.io/${{ github.repository_owner }}/dsh-review:${{ steps.meta.outputs.version }}
          # sha-* 标签已停用（见 docs/image-matrix.md）
