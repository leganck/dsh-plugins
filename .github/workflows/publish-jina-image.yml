name: publish-jina-image

# 发布「jina-code 变体」镜像：ghcr.io/leganck/dsh-embed:jina-cpu / jina-gpu
#
# 触发：
#   - 打 tag：dsh-embed-jina-v0.1.0 → 构建 + 冒烟 + 推送
#   - 手动 workflow_dispatch → 只构建 + 冒烟；勾 push 才推（:latest-jina-*）
#
# 模型不在 git 里：从同名 GitHub Release 的资产下载（jina-v2-*.onnx 等），
# 并用 scripts/jina-v2.sha256 校验；校验失败直接终止，绝不发布。
#
# 先决条件（首次）：创建 release 并上传资产
#   gh release create dsh-embed-jina-v0.1.0 \
#     -n "jina-code 嵌入变体 v0.1.0" \
#     dist/model_fp16.onnx dist/tokenizer.json dist/config.json \
#     dist/tokenizer_config.json dist/special_tokens_map.json

on:
  push:
    tags:
      - 'dsh-embed-jina-v*'
  workflow_dispatch:
    inputs:
      push:
        description: '构建完成后推送到 GHCR'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/leganck/dsh-embed
  PLATFORM: linux/amd64

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      push: ${{ steps.v.outputs.push }}
    steps:
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_PUSH: ${{ inputs.push }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "version=${REF_NAME#dsh-embed-jina-v}" >> "$GITHUB_OUTPUT"
            echo "release=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge" >> "$GITHUB_OUTPUT"
            echo "release=dsh-embed-jina-v0.1.0" >> "$GITHUB_OUTPUT"
            echo "push=$DISPATCH_PUSH" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [cpu, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # 从 Release 拉模型（321 MB），并逐文件 sha256 校验
      - name: fetch jina model (${{ needs.meta.outputs.release }})
        working-directory: server/code-index-service
        run: node scripts/fetch-jina-model.mjs --release "${{ needs.meta.outputs.release }}"

      - name: verify sha256
        working-directory: server/code-index-service
        run: node scripts/fetch-jina-model.mjs --check

      - name: build (${{ matrix.flavor }} / embed-jina)
        uses: docker/build-push-action@v6
        with:
          context: server/code-index-service
          target: embed-jina
          platforms: ${{ env.PLATFORM }}
          build-args: |
            FLAVOR=${{ matrix.flavor }}
            VERSION=${{ needs.meta.outputs.version }}
          build-contexts: |
            models=server/code-index-service/models
          load: true
          tags: dsh-embed:jina-smoke-${{ matrix.flavor }}
          cache-from: type=gha,scope=jina-${{ matrix.flavor }}
          cache-to: type=gha,scope=jina-${{ matrix.flavor }},mode=max

      # 门禁 1：容器内自测（FAKE_EMBED，不需要模型，验证代码/依赖没坏）
      - name: smoke (selftest)
        run: docker run --rm -e FAKE_EMBED=1 dsh-embed:jina-smoke-${{ matrix.flavor }} python /app/selftest.py

      # 门禁 2：真实模型起来 + tag 正确 + 输出 768 维（GPU 镜像在无卡 runner 上会降级 CPU，属预期）
      - name: smoke (real model / health / embed)
        run: |
          docker run -d --name jina-smoke -p 18001:8000 dsh-embed:jina-smoke-${{ matrix.flavor }}
          for i in $(seq 1 40); do
            sleep 2
            if curl -sf http://127.0.0.1:18001/health > /tmp/h.json; then break; fi
          done
          cat /tmp/h.json || true
          python - <<'PY'
          import json, urllib.request
          h = json.load(urllib.request.urlopen("http://127.0.0.1:18001/health", timeout=10))
          assert h.get("ready") is True, h
          assert "jina-embeddings-v2-base-code" in h["tag"], h
          body = json.dumps({"texts": ["def add(a, b):\n    return a + b\n"]}).encode()
          req = urllib.request.Request("http://127.0.0.1:18001/embed", data=body,
                                       headers={"Content-Type": "application/json"})
          r = json.load(urllib.request.urlopen(req, timeout=30))
          assert r["dim"] == 768, r
          print("smoke ok:", h["tag"], "dim=", r["dim"])
          PY
          docker rm -f jina-smoke

      - uses: docker/login-action@v3
        if: needs.meta.outputs.push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push (${{ matrix.flavor }})
        if: needs.meta.outputs.push == 'true'
        run: |
          refs="latest-jina-${{ matrix.flavor }} jina-${{ matrix.flavor }}"
          if [ "${{ needs.meta.outputs.version }}" != "edge" ]; then
            refs="$refs dsh-embed-jina-v${{ needs.meta.outputs.version }}-${{ matrix.flavor }}"
          fi
          refs="$refs sha-${GITHUB_SHA::7}-jina-${{ matrix.flavor }}"
          for r in $refs; do
            docker tag dsh-embed:jina-smoke-${{ matrix.flavor }} "$IMAGE:$r"
            docker push "$IMAGE:$r"
          done
          echo "已推送：$refs"
