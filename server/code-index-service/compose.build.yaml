# 本地自建（改代码 / 想自己出镜像时用）
#
#   1) 先准备模型（只在 baked 目标需要）：
#        node scripts/fetch-models.mjs            # → models/embed, models/rerank
#   2) 构建 + 起：
#        docker compose -f compose.build.yaml up -d --build
#
# 选不同的模型组合：
#   MODEL_TARGET=nomodel        # 不含模型（再用 -v ./models:/models:ro 挂载）
#   MODEL_TARGET=embed          # 只带嵌入模型（默认，开箱即用）
#   MODEL_TARGET=embed-rerank   # 嵌入 + 重排
#   MODEL_TARGET=embed-jina     # jina 代码检索变体（先 node scripts/fetch-jina-model.mjs）
#
# 模型走独立 build context（additional_contexts.models），不进主上下文哈希。
name: dsh-embed-build

services:
  dsh-embed:
    build:
      context: .
      target: ${MODEL_TARGET:-embed}
      args:
        FLAVOR: ${FLAVOR:-cpu}
        VERSION: ${VERSION:-dev}
      additional_contexts:
        models: ./models
    image: ${IMAGE:-dsh-embed:local-${FLAVOR:-cpu}}
    container_name: dsh-embed
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-18000}:8000"
    environment:
      ORT_THREADS: ${ORT_THREADS:-6}
      EMBED_RATE: ${EMBED_RATE:-10}
      API_KEY: ${API_KEY:-}
    volumes:
      - dsh-embed-data:/data
      # nomodel 时把它打开（并把 MODEL_TARGET 设成 nomodel）：
      # - ./models:/models:ro   # models/ 下就是 model/ 与 model-rerank/，与镜像内布局一致

volumes:
  dsh-embed-data:
    name: dsh-embed-data
