# gitleaks 配置：默认规则 + 本项目允许的占位符与测试夹具。
# 用法：gitleaks detect --source . --config .gitleaks.toml --redact
[extend]
useDefault = true

[[allowlists]]
description = "示例与占位符"
paths = [
  '''(^|/)\.env\.example$''',
  '''(?i)(^|/)plugins/[^/]+/(test|tests?)/''',
  '''(?i)(^|/)plugins/[^/]+/test[^/]*\.(mjs|js|ts)$''',
  '''(?i)(^|/)server/[^/]+/tests?/''',
  '''(?i)(^|/)server/[^/]+/selftest\.py$''',
]
regexes = [
  '''REPLACE_WITH_[A-Z_]+''',
  '''(?i)change[-_]me[-\w]*''',
  '''(?i)(your|example|placeholder|dummy|fake|test|mock)[-_]?(token|key|secret|password|pat)[-_]?[\w-]*''',
]

[[allowlists]]
description = "模型清单的 sha256 完整性校验值（非凭据；generic-api-key 对 64 位 hex 的固定误报）。含历史中已删除的模型工具（ab-embedding-models.mjs / 旧 test.mjs 的模型清单）"
paths = [
  '''model_downloader\.py$''',
  '''fetch-models\.mjs$''',
  '''ab-embedding-models\.mjs$''',
  '''(^|/)test\.mjs$''',
]
regexTarget = "line"
regexes = [
  '''sha256["']?\s*[:=]\s*["'][0-9a-f]{64}''',
  '''["'][0-9a-f]{64}["']''',
]
