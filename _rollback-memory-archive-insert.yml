# 回滚用：转换到 install_bundle 之前，profile 补丁层里 memory-archive 的手写 insert 行
#
# 用途：若 `plugin_manager install_bundle` 失败，把下面这段原样粘回
# `~/.dsh/profiles/desktop/cordis.patch.yml` 的同一位置（原在第 411-423 行，
# 紧跟在 `- id: ui-theme` 之前），即可恢复到转换前的可用状态。
#
# 记录时间：2026-10-16 14:5x（转换前原文，逐字复制）

- insert:
    - id: memory-archive
      name: "file:///C:/Users/you/dsh-bundles/dsh-memory-archive/index.js"
      config:
        # 绝对路径，且用正斜杠：对**新旧两版**插件代码都解析到同一目录。
        # 不能用 "~/.dsh/archive"——线上进程持有的是启动时那份代码，不展开 ~，
        # 会把字面量 "~" 当成目录名建到工作区里（2026-10-13 实测：配置热生效、
        # 模块不重新 import）。重启换上新代码后，才能安全地改用 ~ 或 $DSH_HOME。
        archiveDir: "C:/Users/you/.dsh/archive"
        includeToolResults: true
        redact: true
        announce: true
