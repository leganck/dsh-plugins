# 回滚用：转换到 install_bundle 之前，profile 补丁层里 code-index 的手写 insert 行
#
# 用途：若 `plugin_manager install_bundle`（tarball）失败，把下面这段原样粘回
# `~/.dsh/profiles/desktop/cordis.patch.yml`（原在第 420-439 行，紧跟在
# `- id: ui-theme` 的 config 之后、`- id: tool-plugin-manager` 注释之前），
# 即可恢复到转换前的可用状态。
#
# 注意：粘回时**必须同时删掉**转换后新增的那条 `- id: code-index` 覆盖行，
# 否则同一 id 两处定义 → 插件被加载两次。
#
# 记录时间：2026-10-16（转换前原文，逐字复制）

# 2026-10-15 —— 代码索引插件（本地混合检索：FTS5/BM25 + 本地 ONNX 向量 → RRF 融合）。
# 源码：C:\Users\you\dsh-bundles\dsh-code-index（工作区外，避免被清理；工作区内是开发副本）
# 依赖：该目录已 npm install —— onnxruntime-node（win32 含 DirectML.dll）与 @huggingface/transformers
# 模型：C:\Users\you\.dsh\models\bge-small-zh-v1.5（fp16 45.3MB 走 GPU / int8 22.8MB 走 CPU）
# 向量缓存：与 Python 实验版**共用** ~/.dsh/index/vectors.db，key = `模型标签:sha256(块文本)`
# 实测（40 个真实检索事件 / 14 个仓库）：grep 循环 10% → 纯 FTS5 32.5% → 纯向量 37.5% → 混合 55%（@10）
# 建库：FTS5 亚秒级；向量 GPU 约 47 块/s（erp-pos 13,889 块 ≈ 4.7 分钟），增量只算变化块
# 回滚：删除下面 12 行即可（已建索引在 C:\Users\you\.dsh\code-index，可一并删除）
# roots 是安全白名单：不在其中的路径会被拒绝，且校验发生在创建索引库之前。
# indexDirBase 用「基目录 + 每仓库子目录」，索引不落在代码仓库里，不会污染 git status。
- insert:
    - id: code-index
      name: "file:///C:/Users/you/dsh-bundles/dsh-code-index/index.js"
      config:
        indexDirBase: "C:/Users/you/.dsh/code-index"
        roots:
          - "D:/Code"
        embedding:
          backend: "auto"
          modelDir: "C:/Users/you/.dsh/models/bge-small-zh-v1.5"
