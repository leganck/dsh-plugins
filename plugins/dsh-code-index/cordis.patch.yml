# 本 bundle 自带的插件行。
#
# name 用**包名**而非 file:// 路径：bundle 经 plugin_manager 的 install_bundle 安装后，
# 该包从 profile 的 node_modules 解析。
#
# 这里只放**可移植的默认值**；机器相关或团队相关的取值（roots 白名单、远端地址、
# 索引位置、限速）请在你自己 profile 的 cordis.patch.yml 里按 id 覆盖 ——
# 用户补丁层在所有 bundle 层之后应用，且能跨插件升级保留。
- insert:
    - id: code-index
      name: '@local/dsh-code-index'
      config:
        roots: []
        # 默认 keywords-only，保证 bundle 单独安装也一定能加载；
        # 有服务端时把 vectors 改成 remote 并填 remote.url
        vectors: off
        # remote:
        #   url: https://dsh-embed.example.com
        #   apiKey: null
        # rerank: off | fast（top-10）| quality（top-20）
        #
        # advanced（可选）：
        # advanced:
        #   indexDirBase: ~/.dsh/code-index
        #   remoteRateLimit: 10
